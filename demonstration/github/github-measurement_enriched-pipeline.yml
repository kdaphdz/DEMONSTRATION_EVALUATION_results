name: Benchmark
'on':
  push: {}
jobs:
  benchmark_9:
    runs-on: self-hosted
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    - name: Upgrade pip and install dependencies
      run: |-
        pip install --upgrade pip
        pip install -r requirements.txt
    - run: ~/runner-config/scripts/setup.sh "start_measurement" "baseline=true" "benchmark_3"
        "software" perf "interval=10" "events=power/energy-pkg/,power/energy-cores/"
    - name: Run benchmark tests
      run: pytest --benchmark-only --benchmark-save=benchmark_run
    - run: ~/runner-config/scripts/setup.sh "end_measurement" "benchmark_3"
