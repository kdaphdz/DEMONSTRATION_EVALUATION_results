name: Benchmark
on:
  push:
    branches:
      include:
      - master
stages:
- stage: stage
  displayName: "Benchmark Stage"
  jobs:
  - job: benchmark
    pool:
      name: "MyAgent"
    steps:
    - task: CmdLine@2
      inputs:
        script: |
        	"pip install --upgrade pip\npip install -r requirements.txt\n"
      displayName: "Upgrade pip and install dependencies"
    - task: CmdLine@2
      inputs:
        script: "pytest --benchmark-only --benchmark-save=benchmark_run"
      displayName: "Run benchmark tests"