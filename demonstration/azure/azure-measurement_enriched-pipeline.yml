name: Benchmark
trigger:
- push
stages:
- stage: stage
  displayName: Benchmark Stage
  jobs:
  - job: benchmark_9
    pool:
      name: MyAgent
    steps:
    - task: CmdLine@2
      inputs:
        script: |-
          pip install --upgrade pip
          pip install -r requirements.txt
      displayName: Upgrade pip and install dependencies
    - task: CmdLine@2
      inputs:
        script: pytest --benchmark-only --benchmark-save=benchmark_run
      displayName: Run benchmark tests
