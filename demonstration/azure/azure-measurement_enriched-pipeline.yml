trigger:
  - push

stages:
  - stage: Benchmark
    jobs:
      - job: benchmark_9
        pool:
          name: MyAgent
        steps:
          - task: CmdLine@2
            displayName: 'Install dependencies'
            inputs:
              script: |
                python3 -m pip install -r requirements.txt

          - task: CmdLine@2
            inputs:
              script: |
                ~/runner-config/scripts/setup.sh "start_measurement" "baseline=true" "benchmark_3" "software" perf "interval=10" "events=power/energy-pkg/,power/energy-cores/"

          - task: CmdLine@2
            displayName: 'Run benchmark tests'
            inputs:
              script: |
                python3 -m pytest --benchmark-only --benchmark-save=benchmark_run

          - task: CmdLine@2
            inputs:
              script: |
                ~/runner-config/scripts/setup.sh "end_measurement" "benchmark_3"

