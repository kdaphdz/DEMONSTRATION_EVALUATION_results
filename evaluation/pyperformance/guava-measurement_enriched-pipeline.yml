name: test
'on':
  push:
    branches:
    - '*'
jobs:
  test:
    runs-on: self-hosted
    name: self-hosted - Python 3.10
    steps:
    - run: ~/runner-config/scripts/setup.sh "start_measurement" "baseline=true" "test_all" "software" perf "interval=10" "events=power/energy-pkg/,power/energy-cores/"
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install
      run: |-
        python -m pip install --upgrade pip setuptools
        python -m pip install -e .
    - name: Display Python version
      run: |-
        python -VV
        python -c 'import sysconfig; print("Free threading?", "Yes" if sysconfig.get_config_var("Py_GIL_DISABLED") else "No")'
    - name: Run Tests
      id: pyperformance
      run: python -u -m pyperformance.tests
    - run: ~/runner-config/scripts/setup.sh "end_measurement" "test_all"
